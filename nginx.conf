server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check for Jenkins / reverse proxies.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # Redirect /folder -> /folder/ so relative assets resolve for both static
    # folders and Svelte/Vite builds served below their folder name.
    location ~ ^/([^/.]+)$ {
        return 301 /$1/;
    }

    # Serve every deployed top-level folder by its folder name:
    #   /HW1b_ca1/ -> /usr/share/nginx/html/HW1b_ca1/index.html
    #   /HW1b_ca2/ -> /usr/share/nginx/html/HW1b_ca2/index.html
    #   /project1/ -> /usr/share/nginx/html/project1/index.html
    #   /hw2/      -> /usr/share/nginx/html/hw2/index.html
    # SPA fallback keeps nested client routes working if Svelte apps add them.
    location ~ ^/([^/]+)/ {
        try_files $uri $uri/ /$1/index.html =404;
    }

    # The Dockerfile generates this index with links to all deployed folders.
    location = / {
        try_files /index.html =404;
    }
}
