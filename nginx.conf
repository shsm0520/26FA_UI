server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check for Jenkins / reverse proxies.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # Redirect /project1 -> /project1/ so Vite's relative assets resolve.
    location ~ ^/([^/.]+)$ {
        return 301 /$1/;
    }

    # Serve every built app by its folder name:
    #   /project1/ -> /usr/share/nginx/html/project1/index.html
    #   /hw2/      -> /usr/share/nginx/html/hw2/index.html
    # SPA fallback keeps nested client routes working if they are added later.
    location ~ ^/([^/]+)/ {
        try_files $uri $uri/ /$1/index.html =404;
    }

    location = / {
        default_type text/html;
        return 200 '<!doctype html><html><head><title>26FA UI</title></head><body><h1>26FA UI</h1><ul><li><a href="/project1/">project1</a></li><li><a href="/hw2/">hw2</a></li></ul></body></html>';
    }
}
